# Ruff ref:
# - https://docs.astral.sh/ruff/linter/
# - https://docs.astral.sh/ruff/configuration/
# - https://docs.astral.sh/ruff/rules/
# - https://docs.astral.org.cn/ruff/linter/
# - https://docs.astral.org.cn/ruff/configuration/
# - https://docs.astral.org.cn/ruff/rules/
include = [
	"**/pyproject.toml",
	"**/pixi.toml",
	"**/src/**/*.py",
	"**/scripts/**/*.py",
	"**/examples/**/*.py",
	"**/contrib/**/*.py",
	"**/demos/**/*.py",
	"**/tests/**/*.py",
]
line-length = 79
indent-width = 4

[lint]
# Ref: https://docs.astral.org.cn/ruff/rules/#flake8-use-pathlib-pth
# select = ["E4", "E7", "E9", "F"]
select = [
    # 基础
    "E",          # pycodestyle 错误
    "W",          # pycodestyle 警告
    "F",          # pyflakes
    # 代码质量
    "B",          # bugbear
    "C4",         # 推导式
    "UP",         # 语法升级
    "SIM",        # 简化写法
    "PERF",       # 性能
    "RUF",        # ruff 自有规则
    # 安全
    "S",          # bandit 安全
    # 代码风格
    "I",          # import 排序
    "N",          # 命名
    "D",          # docstring
    # 错误处理
    "TRY",        # try/except 规范
    # 其他
    "LOG",        # logging
    "C90",        # 复杂度
    "TCH",        # 类型标注导入
    "T20",        # 检测 print
]
ignore = [
    # Docstring
    "D100",       # 模块不需要 docstring
    "D104",       # 包不需要 docstring
    "D107",       # __init__ 不强制 docstring
    # 代码质量
    "S101",       # 允许 assert（测试中常用）
    "TRY003",     # 不强制 raise from
    "E501",       # `ruff format` 尽量处理，但 `ruff check` 不报错
    # 命名规则 - 项目使用匈牙利命名法和数学符号惯例
    "N802",       # 函数名非小写（如 LR0, LALR, camelCase 等缩写）
    "N803",       # 参数名非小写（如 N 表示数量，_F/_D/_ST/_Q 类型后缀）
    "N806",       # 函数内变量非小写（常量、匈牙利命名法）
    "N812",       # 导入别名非小写（如 MAXINT）
    "N818",       # 异常名无 Error 后缀（如 UnrecoverableException）
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",       # 允许 assert
    "D",          # 测试文件不要求 docstring
    "ANN",        # 测试文件不要求类型标注
    "T20",        # 允许 print
]

[lint.isort]
known-first-party = [
    "flagbear",
    "statbear",
    "nutsbear",
    "dirtbear",
]

[lint.pydocstyle]
convention = "google"

[format]
exclude = ["*.ipynb"]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
