[project]
name = "nutsbear"
dynamic = [
	"version",
]
authors = [
	{name = "UBeaRLy", email = "ubearly@outlook.com"},
]
description = "A project for collecting some tricks."
long_description_content_type = "text/x-rst"
long_description = "README.md"
readme = { file = "README.md", content-type = "text/plain" }
classifiers = [
	"Development Status :: 3 - Alpha",
	"Environment :: Console",
	"Programming Language :: Python",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.12",
]
license-files = [ "license.txt" ]
requires-python = ">=3.12"
dependencies = [
	"numpy >=2.0, <3.0",
	"torch >=2.0",
	"torchvision",
	"tensorboard",
	"flagbear",
]

[project.optional-dependencies]
directml = [
	"torch-directml >= 0.2.5.dev",
]

[project.urls]
homepage = "https://github.com/xyy15926"


# ***************************** Build with hatcling
# Hatchling ref:
# - https://hatch.pypa.io/latest/config/build/
[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/nutsbear/__init__.py"

[tool.hatch.build]
skip-excluded-dirs = true
directory = "dist"
# Directories that should be included in the development environment.
dev-mode-dirs = ["src"]

# Build source distribution.
[tool.hatch.build.targets.sdist]
# 1. Merge all files under `sources` together, just like searching paths.
sources = [ "src" ]
# 2. Ignore `.gitignore`，`.hgignore`.
ignore-vcs = false
# 3. Select the files with git-style glob pattern, with `exclude` taking
#   precedence.
include = [
	"src/**/*.py",
	"src/**/*.csv",
	"src/**/*.json",
	"src/**/*.toml",
]
exclude = []

# Build binary distribution.
# According to hatchling building log: `wheel` will be built from `sdist`.
# So the items in `targets.wheel`, `packages` for example, should be set based
#   on the `targets.sdist`.
[tool.hatch.build.targets.wheel]
# 1. The children pacakges will be packaged recursively, which is different
#   from the `setuptools`.
packages = [ "nutsbear" ]
# 2. `artifacts` is semantically equivalent to `include` but not affected by
# `exclude`.
# 2.1 But `"!"` could be used to excluded more generic items in `artifacts`.
artifacts = [
	"*.so",
	"*.dll",
	"!tmp/*.so",
	"!tmp/*.dll",
]
# 3. Include other files besides `.py` and `artifacts` in packages.
only-packages = false

# ***************************** Lint with Ruff
# Ruff ref:
# - https://docs.astral.ac.cn/ruff/linter/
# - https://docs.astral.ac.cn/ruff/configuration/
[tool.ruff]
include = [
	"pyproject.toml",
	"pixi.toml",
	"src/**/*.py",
	"scripts/**/*.py",
	"examples/**/*.py",
	"contrib/**/*.py",
	"demos/**/*.py",
]
line-length = 79
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
# Ref: https://docs.astral.org.cn/ruff/rules/#flake8-use-pathlib-pth
# select = ["E4", "E7", "E9", "F"]
select = [
    # 基础
    "E",          # pycodestyle 错误
    "W",          # pycodestyle 警告
    "F",          # pyflakes
    # 代码质量
    "B",          # bugbear
    "C4",         # 推导式
    "UP",         # 语法升级
    "SIM",        # 简化写法
    "PERF",       # 性能
    "RUF",        # ruff 自有规则
    # 安全
    "S",          # bandit 安全
    # 代码风格
    "I",          # import 排序
    "N",          # 命名
    "D",          # docstring
    # 错误处理
    "TRY",        # try/except 规范
    # 其他
    "LOG",        # logging
    "C90",        # 复杂度
    "TCH",        # 类型标注导入
    "T20",        # 检测 print
]
ignore = [
    # Docstring
    "D100",       # 模块不需要 docstring
    "D104",       # 包不需要 docstring
    "D107",       # __init__ 不强制 docstring
    # 代码质量
    "S101",       # 允许 assert（测试中常用）
    "TRY003",     # 不强制 raise from
    "E501",       # `ruff format` 尽量处理，但 `ruff check` 不报错
    # 命名规则 - 项目使用匈牙利命名法和数学符号惯例
    "N802",       # 函数名非小写（如 LR0, LALR, camelCase 等缩写）
    "N803",       # 参数名非小写（如 N 表示数量，_F/_D/_ST/_Q 类型后缀）
    "N806",       # 函数内变量非小写（常量、匈牙利命名法）
    "N812",       # 导入别名非小写（如 MAXINT）
    "N818",       # 异常名无 Error 后缀（如 UnrecoverableException）
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",       # 允许 assert
    "D",          # 测试文件不要求 docstring
    "ANN",        # 测试文件不要求类型标注
    "T20",        # 允许 print
]

[tool.ruff.lint.isort]
known-first-party = [
    "flagbear",
    "statbear",
    "nutsbear",
    "distbear",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
exclude = ["*.ipynb"]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
